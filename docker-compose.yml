version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      
    container_name: Matrimony_Ai_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 7000 --reload
    ports:
      - "7000:7000"

    # --- REPLACE THE ENVIRONMENT BLOCK WITH THIS ---
    env_file:
      - ./.env